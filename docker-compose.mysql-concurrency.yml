name: fleet-mysql-concurrency

services:
  mysql-concurrency:
    image: mysql:8.4
    container_name: fleet-mysql-concurrency
    restart: "no"
    ports:
      - "127.0.0.1:33087:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_CONCURRENCY_DATABASE:?Set MYSQL_CONCURRENCY_DATABASE in .env.mysql-concurrency}
      MYSQL_USER: ${MYSQL_CONCURRENCY_USERNAME:?Set MYSQL_CONCURRENCY_USERNAME in .env.mysql-concurrency}
      MYSQL_PASSWORD: ${MYSQL_CONCURRENCY_PASSWORD:?Set MYSQL_CONCURRENCY_PASSWORD in .env.mysql-concurrency}
      MYSQL_ROOT_PASSWORD: ${MYSQL_CONCURRENCY_ROOT_PASSWORD:?Set MYSQL_CONCURRENCY_ROOT_PASSWORD in .env.mysql-concurrency}
      MYSQL_CONCURRENCY_INSTANCE_ID: ${MYSQL_CONCURRENCY_INSTANCE_ID:?Set MYSQL_CONCURRENCY_INSTANCE_ID in .env.mysql-concurrency}
    command:
      - --default-storage-engine=InnoDB
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/MySqlConcurrency/docker/init.sh:/docker-entrypoint-initdb.d/01-concurrency-guard.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - mysql-concurrency

networks:
  mysql-concurrency:
    name: fleet-mysql-concurrency
